        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadURLsRequest'
      responses:
        '201':
          description: Presigned upload URLs generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/scan-batch:
    post:
      tags:
      - Motors
      summary: Scan STNK images via AI
      operationId: scanStnkBatch
      description: Premium endpoint. Maximum 10 files per batch. Response is an array with no wrapper.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBatchRequest'
      responses:
        '201':
          description: Scan results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/{id}/images/upload-urls:
    post:
      tags:
      - Motors
      summary: Get presigned upload URLs for motor images
      operationId: getMotorImageUploadUrls
      description: Maximum 10 files. Backend immediately persists storageKey to motorImages after generating URLs.
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadURLsRequest'
      responses:
        '201':
          description: Presigned upload URLs generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadURLsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/{id}/sold:
    patch:
      tags:
      - Motors
      summary: Mark motor as sold
      operationId: markMotorSold
      description: No request body required. Sets status to SOLD and populates soldAt.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Motor marked as sold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorDataResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/{id}/images:
    patch:
      tags:
      - Motors
      summary: Replace motor images
      operationId: replaceMotorImages
      description: Replaces the entire image list. Maximum 20 images.
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMotorImagesRequest'
      responses:
        '200':
          description: Motor images replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dashboard/stats:
    get:
      tags:
      - Analytics
      summary: Get dashboard summary
      operationId: getDashboardStats
      security: *id001
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: ^(0[1-9]|1[0-2])-\d{4}$
          example: 06-2024
        description: Month in MM-YYYY format.
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dashboard/selling-report/daily:
    get:
      tags:
      - Analytics
      summary: Get daily selling report
      operationId: getDailySellingReport
      security: *id001
      parameters:
      - &id003
        name: date
        in: query
        required: true
        schema:
          type: string
          example: 11-6-2024
        description: Date in D-M-YYYY or DD-MM-YYYY format.
      responses:
        '200':
          description: Daily selling report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellingReportResponse'
        '400':
