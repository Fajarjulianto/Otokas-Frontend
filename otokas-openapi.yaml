  /dashboard/incoming-stock/report:
    get:
      tags:
      - Analytics
      summary: Get incoming stock report
      operationId: getIncomingStockReport
      security: *id001
      parameters:
      - *id003
      responses:
        '200':
          description: Incoming stock report
          content:
            application/json:
              schema:
