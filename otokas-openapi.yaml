              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dashboard/best-selling:
    get:
      tags:
      - Analytics
      summary: Get best-selling motor models
      operationId: getBestSellingMotors
      security: *id001
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 5
          minimum: 1
          maximum: 20
      responses:
        '200':
          description: Best-selling motors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestSellingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscription/status:
    get:
      tags:
      - Subscription
      summary: Get current subscription tier and status
      operationId: getSubscriptionStatus
      description: Use as the frontend source of truth for feature access.
      security: *id001
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscription/checkout:
    post:
      tags:
      - Subscription
      summary: Create Xendit checkout invoice
      operationId: createSubscriptionCheckout
      security: *id001
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscription/notification:
    post:
      tags:
      - Subscription
      summary: Handle Xendit payment webhook
      operationId: handleXenditNotification
      description: Server-to-server endpoint. Backend verifies the callback token and invoice status before activating PREMIUM.
      security: []
      parameters:
      - name: x-callback-token
        in: header
        required: true
        schema:
          type: string
        description: Xendit callback token validated against XENDIT_CALLBACK_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditNotificationRequest'
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants:
    post:
      tags:
      - Tenant
      summary: Create a new tenant
      operationId: createTenant
      description: Each user can own only one tenant, including the auto-provisioned tenant created at registration.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
