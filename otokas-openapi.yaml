              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/branding:
    patch:
      tags:
      - Tenant
      summary: Update tenant branding
      operationId: updateTenantBranding
      description: Premium endpoint.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandingRequest'
      responses:
        '200':
          description: Tenant branding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/banner/upload-url:
    post:
      tags:
      - Tenant
      summary: Get presigned upload URL for tenant banner
      operationId: getTenantBannerUploadUrl
      description: Premium endpoint. Generates a short-lived GCS presigned URL for one banner image.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerUploadRequest'
      responses:
        '201':
          description: Presigned banner upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerUploadResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenants/banner/confirm:
    post:
      tags:
      - Tenant
      summary: Confirm and save tenant banner metadata
      operationId: confirmTenantBanner
      description: Premium endpoint. Called after the client uploads the image directly to GCS.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerConfirmRequest'
      responses:
        '200':
          description: Tenant banner saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/tenants/{subdomain}:
    get:
      tags:
      - Public Tenant
      summary: Get tenant profile
      operationId: getPublicTenantProfile
      security: []
      parameters:
      - &id004
        name: subdomain
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 63
        example: rullymotor
      responses:
        '200':
          description: Public tenant profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTenantProfile'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/tenants/{subdomain}/landing-content:
    get:
      tags:
      - Public Tenant
      summary: Get tenant landing page content
      operationId: getPublicLandingContent
      description: Uses the supported landing-config sections and omits businessHours.
      security: []
      parameters:
      - *id004
      responses:
        '200':
          description: Public landing content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingContent'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/tenants/{subdomain}/motors:
    get:
      tags:
      - Public Tenant
      summary: Get paginated tenant motor listings
      operationId: getPublicMotorListings
      description: Fields controlled by motorDisplay are returned as null when hidden.
      security: []
      parameters:
      - *id004
      - &id005
        name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - &id006
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Paginated public motor listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMotorListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/tenants/{subdomain}/search:
    get:
      tags:
      - Public Tenant
      summary: Search tenant motor listings
      operationId: searchPublicMotors
      description: When q is omitted, returns all motors like the listing endpoint.
      security: []
      parameters:
      - *id004
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive partial match against motor brand and name.
      - *id005
      - *id006
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMotorListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /download/file:
    get:
      tags:
      - Download
      summary: Get signed GCS download URL for app APK
      operationId: getSignedDownloadUrl
      description: Signed URL expires in 24 hours.
      security: []
      responses:
        '200':
          description: Signed APK URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedDownloadResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token sent as `Authorization: Bearer <access_token>`.'
  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: Validation error message
        error:
          type: string
          example: Bad Request
      required:
      - statusCode
      - message
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: <jwt_access_token>
      required:
      - access_token
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - dealerName
      - deviceId
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123
        dealerName:
          type: string
          example: John Motor
        deviceId:
          type: string
          example: ios-iphone14pro-abc123
        phoneNumber:
          type: string
          example: 081234567890
          description: Optional during registration.
    RegisterResponse:
      type: object
      required:
      - message
      - user
      properties:
        message:
          type: string
          example: User registered successfully
        user:
          type: object
          required:
          - id
          - email
          - createdAt
          properties:
            id:
              type: string
              format: uuid
              example: 8f31b9d3-1300-4c11-89cb-b31e40dd5f3a
            email:
              type: string
              format: email
              example: user@example.com
            createdAt:
              type: string
              format: date-time
              example: '2026-05-23T11:27:18.102Z'
    LoginRequest:
      type: object
      required:
      - email
      - password
      - deviceId
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123
        deviceId:
          type: string
          example: ios-iphone14pro-abc123
    RefreshRequest:
      type: object
      required:
      - refresh_token
      - deviceId
      properties:
        refresh_token:
          type: string
          example: <jwt_refresh_token>
        deviceId:
          type: string
          example: ios-iphone14pro-abc123
    LogoutRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          example: <jwt_refresh_token>
    CurrentUser:
      type: object
      required:
      - userId
      - email
      properties:
        userId:
          type: string
          format: uuid
          example: 8f31b9d3-1300-4c11-89cb-b31e40dd5f3a
        email:
          type: string
          format: email
          example: user@example.com
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dealerName:
          type: string
          example: John Motor
        email:
          type: string
          format: email
          example: user@example.com
        phoneNumber:
          type: string
          nullable: true
          example: 081234567890
        deviceId:
          type: string
          example: ios-iphone14pro-abc123
        isVerified:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        dealerName:
          type: string
          example: Super Motors Updated
        phoneNumber:
          type: string
          example: 081234567890
    RequestPasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
      - email
      - otp
      - newPassword
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        otp:
          type: string
          example: '123456'
        newPassword:
          type: string
          format: password
          example: newP@ssw0rd123
    VerifyEmailRequest:
      type: object
      required:
      - email
      - token
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        token:
          type: string
          example: a1b2c3d4...
    MotorImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: image-uuid
        storageKey:
          type: string
          example: motor-images/user-uuid/motor-uuid/1710000000-beat.jpg
        url:
          type: string
          format: uri
          example: https://storage.googleapis.com/bucket/motor-images/example.jpg
        width:
          type: integer
          nullable: true
          example: 1200
        height:
          type: integer
          nullable: true
          example: 800
        size:
          type: integer
          nullable: true
          example: 248123
    Motor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1f987066-1594-4d03-8ebc-4b967eb3f2ac
        frameNumber: &id007
          type: string
          nullable: true
          example: MH1HB211XJK123456
        engineNumber: &id008
          type: string
          nullable: true
          example: HB21E1123456
        stnkCode: &id009
          type: string
          nullable: true
          example: NC11D1CF
        brand: &id010
          type: string
          example: Honda
        name: &id011
          type: string
          example: Revo Fit
        category: &id012
          type: string
          nullable: true
          enum:
          - MATIC
          - CUB
          - SPORT
          - MANUAL
          example: CUB
        year: &id013
          type: integer
          minimum: 1900
          nullable: true
          example: 2021
        plateNumber: &id014
          type: string
          nullable: true
          example: B 1234 ABC
        color: &id015
          type: string
          nullable: true
          example: Hitam
        displacement: &id016
          type: integer
          nullable: true
          example: 110
        kilometer: &id017
          type: integer
          minimum: 0
          nullable: true
          example: 24500
        tax: &id018
          type: string
          nullable: true
          enum:
          - PAID
          - UNPAID
          - PENDING
          example: PAID
        buyingPrice: &id019
          type: number
          example: 12000000
        sellingPrice: &id020
          type: number
          nullable: true
          example: 13500000
        status:
          type: string
          enum:
          - AVAILABLE
          - BOOKED
          - SOLD
          - ARCHIVED
          example: AVAILABLE
        isIncomplete: &id021
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-05-23T11:58:10.392Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-05-23T11:58:10.392Z'
        soldAt:
          type: string
          format: date-time
          nullable: true
          example: null
        motorImages:
          type: array
          items:
            $ref: '#/components/schemas/MotorImage'
    MotorCreateRequest:
      type: object
      required:
      - brand
      - name
      - buyingPrice
      - isIncomplete
      properties: &id022
        frameNumber: *id007
        engineNumber: *id008
        stnkCode: *id009
        brand: *id010
        name: *id011
        category: *id012
        year: *id013
        plateNumber: *id014
        color: *id015
        displacement: *id016
        kilometer: *id017
        tax: *id018
        buyingPrice: *id019
        sellingPrice: *id020
        isIncomplete: *id021
    MotorUpdateRequest:
      type: object
      description: All fields are optional.
      properties: *id022
    MotorDataResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Motor'
      required:
      - data
    MotorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Motor'
      required:
      - data
    UploadFileDescriptor:
      type: object
      required:
      - fileName
      - mimeType
      properties:
        fileName:
          type: string
          example: stnk-revo.jpg
        mimeType:
          type: string
          example: image/jpeg
    UploadURL:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          example: https://storage.googleapis.com/bucket/path?X-Goog-Signature=...
        filePath:
          type: string
          example: stnk-uploads/1710000000-stnk-revo.jpg
        mimeType:
          type: string
          example: image/jpeg
      required:
      - uploadUrl
      - filePath
    UploadURLsRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/UploadFileDescriptor'
    UploadURLsResponse:
      type: object
      required:
      - uploads
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadURL'
    ScanFile:
      type: object
      required:
      - filePath
      - mimeType
      properties:
        filePath:
          type: string
          example: stnk-uploads/1710000000-stnk-revo.jpg
        mimeType:
          type: string
          example: image/jpeg
    ScanBatchRequest:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ScanFile'
    ScanResult:
      type: object
      properties:
        brand:
          type: string
          example: Honda
        name:
          type: string
          example: Revo Fit
        frameNumber:
          type: string
          example: MH1HB211XJK123456
        engineNumber:
          type: string
          example: HB21E1123456
        year:
          type: integer
          example: 2021
        plateNumber:
          type: string
          example: B 1234 ABC
        color:
          type: string
          example: Hitam
        category:
          type: string
          enum:
          - MATIC
          - CUB
          - SPORT
          - MANUAL
          example: CUB
        stnkCode:
          type: string
          example: NC11D1CF
        displacement:
          type: integer
          example: 110
        isAmbiguous:
          type: boolean
          example: false
        isIncomplete:
          type: boolean
          example: false
        remarks:
          type: string
          example: ''
    BulkMotorItem:
      allOf:
      - $ref: '#/components/schemas/MotorCreateRequest'
      description: Motor object mapped from scan result and completed with buyingPrice; sellingPrice is optional.
    BulkCreateRequest:
      type: object
      required:
      - motors
      properties:
        motors:
          type: array
          items:
            $ref: '#/components/schemas/MotorCreateRequest'
    BulkCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Motors successfully imported
        count:
          type: integer
          example: 1
      required:
      - message
      - count
    ReplaceMotorImagesRequest:
      type: object
      required:
      - images
      properties:
        images:
          type: array
          maxItems: 20
          items:
            type: object
            required:
            - storageKey
            - url
            properties:
              storageKey:
                type: string
                example: motor-images/user-uuid/motor-uuid/1710000000-motor-depan.jpg
              url:
                type: string
                format: uri
                example: https://storage.googleapis.com/bucket/motor-images/example.jpg
              width:
                type: integer
                example: 1200
              height:
                type: integer
                example: 800
              size:
                type: integer
                example: 248123
    DashboardStatsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            stock:
              type: integer
              example: 24
            sold:
              type: integer
              example: 8
            currentMonthProfit:
              type: number
              example: 32500000
            currentMonthRevenue:
              type: number
              example: 50000000
            marginAverage:
              type: number
              example: 12.4
    SellingMotorSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: motor-uuid
        name:
          type: string
          example: Beat FI
        brand:
          type: string
          example: Honda
        plateNumber:
          type: string
          example: B 1234 ABC
        sellingPrice:
          type: number
          example: 14500000
    SellingReportResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: '2024-06-11'
              count:
                type: integer
                example: 1
              revenue:
                type: number
                example: 14500000
              motors:
                type: array
                items:
                  $ref: '#/components/schemas/SellingMotorSummary'
    IncomingStockResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: '2024-06-11'
              count:
                type: integer
                example: 2
              totalBuyingPrice:
                type: number
                example: 24000000
    BestSellingResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              brand:
                type: string
                example: Honda
              name:
                type: string
                example: Beat FI
              totalSold:
                type: integer
                example: 12
              totalRevenue:
                type: number
                example: 180000000
    SubscriptionStatus:
      type: object
      properties:
        tier:
          type: string
          enum:
          - FREE
          - PREMIUM
          example: FREE
        status:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - INACTIVE
          example: ACTIVE
        expiresAt:
          type: string
          format: date-time
          nullable: true
          example: null
        tenantId:
          type: string
          format: uuid
          example: tenant-uuid
        subdomain:
          type: string
          example: rullymotor
    CheckoutResponse:
      type: object
      properties:
        invoice_id:
          type: string
          example: 67f71aa8d730d8497a8f8a12
        invoice_url:
          type: string
          format: uri
          example: https://checkout.xendit.co/web/67f71aa8d730d8497a8f8a12
        external_id:
          type: string
          example: TENANT_SUB_tenant-uuid_1716451234567
        status:
          type: string
          example: PENDING
    XenditNotificationRequest:
      type: object
      properties:
        id:
          type: string
          example: 67f71aa8d730d8497a8f8a12
        external_id:
          type: string
          example: TENANT_SUB_tenant-uuid_1716451234567
        status:
          type: string
          example: PAID
        paid_at:
          type: string
          format: date-time
          example: '2025-06-10T10:00:00Z'
    TenantSummary:
      type: object
      properties:
        name:
          type: string
          example: Rully Motor
        subdomain:
          type: string
          example: rullymotor
        fullDomain:
          type: string
          example: rullymotor.otokas.com
        logoUrl:
          type: string
          format: uri
          nullable: true
          example: null
        bannerUrl:
          type: string
          format: uri
          nullable: true
          example: null
        templateKey:
          type: string
          example: t-003
        primaryColor:
          type: string
          nullable: true
          example: '#ff8c00'
        whatsappNumber:
          type: string
          nullable: true
          example: '6281234567890'
    CreateTenantRequest:
      type: object
      required:
      - name
      - subdomain
      properties:
        name:
          type: string
          example: Rully Motor
        subdomain:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^(?!-)(?!.*--)[a-z0-9-]+(?<!-)$
          example: rullymotor
          description: Lowercase alphanumeric with dashes allowed; no leading/trailing/consecutive dashes.
    CreateTenantResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: tenant-uuid
        name:
          type: string
          example: Rully Motor
        subdomain:
          type: string
          example: rullymotor
        fullDomain:
          type: string
          example: rullymotor.otokas.com
    LocationConfig:
      type: object
      properties:
        city:
          type: string
          nullable: true
          example: Bandar Lampung
        address:
          type: string
          nullable: true
          example: Jl. Raden Intan No. 123
        mapsUrl:
          type: string
          format: uri
          nullable: true
          example: https://www.google.com/maps?q=-5.397138,105.266789&z=15&output=embed
        latitude:
          type: number
          format: double
          nullable: true
          example: -5.397138
        longitude:
          type: number
          format: double
          nullable: true
          example: 105.266789
      description: When location is included, latitude and longitude are required together. The API can generate mapsUrl from
        them.
    MotorDisplayConfig:
      type: object
      properties:
        showPrice:
          type: boolean
          example: true
        showYear:
          type: boolean
          example: true
        showStatus:
          type: boolean
          example: true
        showKilometer:
          type: boolean
          example: false
        showTax:
          type: boolean
          example: false
    LandingConfigRequest:
      type: object
      properties:
        whatsappNumber:
          type: string
          example: '6281234567890'
        location:
          $ref: '#/components/schemas/LocationConfig'
        motorDisplay:
          $ref: '#/components/schemas/MotorDisplayConfig'
      description: 'Partial update. Supported sections: whatsappNumber, location, motorDisplay.'
    LandingContent:
      type: object
      properties:
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        content:
          type: object
          properties:
            whatsappNumber:
              type: string
              nullable: true
              example: '6281234567890'
            location:
              $ref: '#/components/schemas/LocationConfig'
            motorDisplay:
              $ref: '#/components/schemas/MotorDisplayConfig'
        schemaVersion:
          type: string
          example: v1
    BrandingRequest:
      type: object
      properties:
        primaryColor:
          type: string
          nullable: true
          pattern: ^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$
          example: '#ff8c00'
          description: 'Hex color (#RGB, #RRGGBB, #RRGGBBAA), or null to clear.'
    BannerUploadRequest:
      type: object
      required:
      - fileName
      - mimeType
      properties:
        fileName:
          type: string
          example: banner.jpg
        mimeType:
          type: string
          example: image/jpeg
    BannerUploadResponse:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
          example: https://storage.googleapis.com/bucket/tenant-banners/1710000000-banner.jpg?X-Goog-Signature=...
        filePath:
          type: string
          example: tenant-banners/1710000000-banner.jpg
    BannerConfirmRequest:
      type: object
      required:
      - storageKey
      - url
      properties:
        storageKey:
          type: string
          example: tenant-banners/1710000000-banner.jpg
        url:
          type: string
          format: uri
          example: https://storage.googleapis.com/bucket/tenant-banners/1710000000-banner.jpg
        width:
          type: integer
          example: 1200
        height:
          type: integer
          example: 400
        size:
          type: integer
          example: 123456
    PublicTenantProfile:
      type: object
      properties:
        name:
          type: string
          example: Rully Motor
        subdomain:
          type: string
          example: rullymotor
        fullDomain:
          type: string
          example: rullymotor.otokas.com
        logoUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/logo.png
        templateKey:
          type: string
          example: t-003
        whatsappNumber:
          type: string
          nullable: true
          example: '6281234567890'
    PublicMotor:
      type: object
      description: Fields controlled by tenant motorDisplay may be null when hidden.
      properties:
        id:
          type: string
          format: uuid
          example: motor-uuid
        title:
          type: string
          example: Honda Beat 2022
        brand:
          type: string
          example: Honda
        price:
          type: number
          nullable: true
          example: 14500000
        year:
          type: integer
          nullable: true
          example: 2022
        status:
          type: string
          nullable: true
          enum:
          - AVAILABLE
          - BOOKED
          - SOLD
          - ARCHIVED
          example: AVAILABLE
        kilometer:
          type: integer
          nullable: true
          example: 12500
        tax:
          type: string
          nullable: true
          enum:
          - PAID
          - UNPAID
          - PENDING
          description: README defines public tax as PAID/UNPAID/PENDING when visible. One README example shows a boolean value,
            which is inconsistent with that table.
        imageUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.otokas.com/image.jpg
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 126
        totalPages:
          type: integer
          example: 7
        hasNextPage:
          type: boolean
          example: true
        hasPreviousPage:
          type: boolean
          example: false
        from:
          type: integer
          example: 1
        to:
          type: integer
          example: 20
    PublicMotorListResponse:
      type: object
      properties:
        tenant:
          type: object
          properties:
            name:
              type: string
              example: Rully Motor
            subdomain:
              type: string
              example: rullymotor
            templateKey:
              type: string
              example: t-003
            fullDomain:
              type: string
              example: rullymotor.otokas.com
            whatsappNumber:
              type: string
              nullable: true
              example: '6281234567890'
        motors:
          type: array
          items:
            $ref: '#/components/schemas/PublicMotor'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SignedDownloadResponse:
      type: object
      properties:
        signedUrl:
          type: string
          format: uri
          example: https://storage.googleapis.com/bucket/Otokas.apk?X-Go-Signature=...
