openapi: 3.0.3
info:
  title: Otokas API
  version: 1.0.0
  description: OpenAPI documentation generated from the Otokas API README. NestJS backend for motorcycle dealer operations
    including authentication, motor inventory, analytics, subscriptions, tenant landing pages, public tenant APIs, AI-assisted
    STNK scanning, and signed APK downloads.
x-source-notes:
- Generated from README.md only; undocumented endpoints were not added.
- 'README defines public motor `tax` as PAID/UNPAID/PENDING in the field-visibility table, while one JSON example shows `tax:
  true`; this specification follows the documented enum and records the inconsistency in the PublicMotor schema description.'
- README's tenant banner confirmation response contains `bannerUrl` twice with different values; this specification models
  bannerUrl once as a nullable URI.
servers:
- url: http://localhost:8080/api/v1
  description: Local development
tags:
- name: Auth
  description: Registration, login, token refresh, logout, and current-user identity.
- name: Users
  description: User profile, password recovery, and email verification.
- name: Motors
  description: Motor inventory CRUD, STNK scanning, bulk import, and motor images.
- name: Analytics
  description: Dashboard and sales/stock analytics.
- name: Subscription
  description: Xendit checkout, webhook, and subscription status.
- name: Tenant
  description: Dealer tenant and landing-page configuration.
- name: Public Tenant
  description: Public dealer profile, landing content, listings, and search.
- name: Download
  description: Signed APK download URL.
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a new dealer account
      operationId: register
      description: Creates a user and auto-provisions a default FREE tenant, membership, and subscription.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login and receive access token
      operationId: login
      description: Returns the access token in the response body and sets the refresh token as an httpOnly cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    delete:
      tags:
      - Auth
      summary: Invalidate a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Get current user payload from JWT
      operationId: getCurrentUser
      security: &id001
      - bearerAuth: []
      responses:
        '200':
          description: Current JWT user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/profile:
    get:
      tags:
      - Users
      summary: Get user profile details
      operationId: getUserProfile
      security: *id001
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Users
      summary: Update user profile
      operationId: updateUserProfile
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
