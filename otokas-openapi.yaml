        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/verify-email:
    post:
      tags:
      - Users
      summary: Verify email with token
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors:
    get:
      tags:
      - Motors
      summary: List user's motors
      operationId: listMotors
      security: *id001
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - AVAILABLE
          - BOOKED
          - SOLD
          - ARCHIVED
        description: Optional motor status filter.
      responses:
        '200':
          description: Motor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Motors
      summary: Create a single motor record
      operationId: createMotor
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotorCreateRequest'
      responses:
        '201':
          description: Motor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/{id}:
    get:
      tags:
      - Motors
      summary: Get a single motor by ID
      operationId: getMotor
      security: *id001
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Motor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorDataResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Motors
      summary: Update motor fields
      operationId: updateMotor
      security: *id001
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotorUpdateRequest'
      responses:
        '200':
          description: Updated motor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Motors
      summary: Delete a motor
      operationId: deleteMotor
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Motor deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/bulk:
    post:
      tags:
      - Motors
      summary: Bulk create motors
      operationId: bulkCreateMotors
      description: Premium endpoint. Map scan results to motor objects and provide buyingPrice; sellingPrice is optional.
