        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /motors/scan/upload-urls:
    post:
      tags:
      - Motors
      summary: Get presigned GCS upload URLs for STNK images
      operationId: getStnkUploadUrls
      description: Premium endpoint. Maximum 10 files per request.
      security: *id001
